<ion-header>
  <ion-toolbar class="eptHeaderToolbar">
    <ion-buttons slot="start">
      @if (isMenuOrBackButton=='menu') {
        <ion-menu-button></ion-menu-button>
      }
      <!-- <ion-back-button *ngIf="isMenuOrBackButton=='back'" (click)="goBack(titleHeader)"></ion-back-button> -->
      @if (isMenuOrBackButton=='back') {
        <ion-icon class="backIcon"
        (click)="goBack()" name="arrow-back"></ion-icon>
      }
    </ion-buttons>
    <ion-title class="eptHeaderTitle">
      <p class="ion-text-wrap" class="title"> {{titleHeader}}</p>
    </ion-title>
  </ion-toolbar>
</ion-header>
