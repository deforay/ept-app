name: Android CI

# Unsigned debug build on every push. Proves the app still compiles; it never
# touches the signing key. Signed builds live in android-release.yml.
#
# Angular 21 and cordova-android 15 both run on Node 22, so the web layer and
# the native shell are built by one toolchain. Cordova and the Ionic CLI are
# project dependencies; nothing is installed globally.

on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy 'tools' package, which current
          # runner images no longer carry, and the step fails.
          packages: platform-tools

      - name: Install SDK platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npx ng build --configuration production

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json', 'config.xml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Add Android platform
        run: npx cordova platform add android

      - name: Build debug APK
        run: npx cordova build android --debug

      # The app has no analytics or advertising SDK; guard against a plugin
      # bringing the advertising permissions back, which would contradict the
      # published privacy policy and Data safety form.
      - name: Assert no advertising permissions
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          APK=$(find platforms/android/app/build/outputs -name '*.apk' | head -1)
          echo "Inspecting $APK"
          "$BT/aapt2" dump badging "$APK" | grep -E 'package:|targetSdkVersion'
          if "$BT/aapt2" dump badging "$APK" | grep -qE 'AD_ID|ADSERVICES'; then
            echo "::error::Advertising permissions present in the build."
            exit 1
          fi
          echo "No advertising permissions found."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ept-debug-${{ github.sha }}
          path: platforms/android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14
