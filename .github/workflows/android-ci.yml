name: Android CI

# Unsigned debug build on every push. Proves the app still compiles; it never
# touches the signing key. Signed builds live in android-release.yml.
#
# The web layer and the native shell need different Node versions and cannot be
# built by one toolchain:
#   - Angular 8 / webpack 4 need Node 16, the last release on OpenSSL 1.1
#   - cordova-android 15 requires Node >= 20.5
# Both stages share one node_modules; only the interpreter changes between them.

on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Pull requests from forks receive no secrets, so google-services.json cannot
    # be restored and the build would always fail. Skip rather than report red.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # google-services.json is deliberately not committed. Without it the build
      # fails at :app:processDebugGoogleServices.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set; the Gradle google-services plugin cannot run without it."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > google-services.json
          python3 -c "import json;json.load(open('google-services.json'))" \
            || { echo "::error::Decoded google-services.json is not valid JSON. Store the secret base64-encoded."; exit 1; }

      # ---- web layer (Node 16) ----

      - name: Use Node 16 for the Angular build
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
          cache: npm

      # The dependency tree predates strict peer resolution: material-moment-adapter
      # declares Angular 9/10 while the app is pinned to Angular 8.
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web assets
        run: npx ng build --prod

      # ---- native shell (Node 22) ----

      - name: Use Node 22 for the Cordova build
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json', 'config.xml') }}
          restore-keys: gradle-${{ runner.os }}-

      # firebasex must be installed with explicit variables: values written only
      # into the package.json cordova.plugins block are ignored on install, which
      # would silently re-enable ad-ID collection.
      - name: Add Android platform
        run: |
          npx -y cordova@13 plugin add cordova-plugin-firebasex@20.0.2 \
            --variable FIREBASE_ANALYTICS_WITHOUT_ADS=true \
            --variable GOOGLE_ANALYTICS_ADID_COLLECTION_ENABLED=false \
            --variable GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_STORAGE=false \
            --variable GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_USER_DATA=false \
            --variable GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS=false
          npx -y cordova@13 platform add android@15.1.0

      - name: Build debug APK
        run: npx -y cordova@13 build android --debug

      # Guards against a regression re-introducing the advertising permissions,
      # which would contradict the published privacy policy and Data safety form.
      - name: Assert no advertising permissions
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          APK=$(find platforms/android/app/build/outputs -name '*.apk' | head -1)
          echo "Inspecting $APK"
          "$BT/aapt2" dump badging "$APK" | grep -E 'package:|targetSdkVersion'
          if "$BT/aapt2" dump badging "$APK" | grep -qE 'AD_ID|ADSERVICES'; then
            echo "::error::Advertising permissions present in the build."
            exit 1
          fi
          echo "No advertising permissions found."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ept-debug-${{ github.sha }}
          path: platforms/android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14
